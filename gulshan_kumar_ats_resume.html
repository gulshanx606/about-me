  <!-- SUMMARY -->
  <div style="margin-bottom:12px">
    <h2 style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;border-bottom:1.5px solid #1a1a1a;padding-bottom:2px;margin-bottom:6px;color:#1a1a1a">Summary</h2>
    <p style="font-size:11.5px;line-height:1.55">${d.summary}</p>
  </div>

  <!-- TECHNICAL SKILLS -->
  <div style="margin-bottom:12px">
    <h2 style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;border-bottom:1.5px solid #1a1a1a;padding-bottom:2px;margin-bottom:6px;color:#1a1a1a">Technical Skills</h2>
    ${d.skills.map(s=>`<p style="font-size:11.5px;margin-bottom:3px"><strong>${s.label}:</strong> ${s.value}</p>`).join('')}

    <h2 style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;border-bottom:1.5px solid #1a1a1a;padding-bottom:2px;margin-bottom:6px;color:#1a1a1a">Experience</h2>

      <div style="margin-bottom:9px">

function setButtonState(id, state, label) {
  const btn = document.getElementById(id);
  btn.className = 'btn ' + (state === 'reset' ? '' : state);
  btn.textContent = label;
  if (state !== 'reset' && state !== 'loading') {
    setTimeout(() => setButtonState(id, 'reset', id === 'btn-pdf' ? 'Download PDF' : 'Download DOC'), 2000);
  }
}

function getExportEl() {
  const el = document.getElementById('resume-export');
  el.style.display = 'block';
  el.innerHTML = document.getElementById('resume-content').innerHTML;
  return el;
}

async function downloadPDF() {
  setButtonState('btn-pdf', 'loading', 'Generating...');
  try {
    const el = getExportEl();
    await html2pdf().set({
      margin: [6, 6, 6, 6],
      filename: 'Gulshan_Kumar_Resume.pdf',
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(el).save();
    el.style.display = 'none';
    setButtonState('btn-pdf', 'success', 'Downloaded!');
  } catch(e) {
    document.getElementById('resume-export').style.display = 'none';
    setButtonState('btn-pdf', 'error', 'Error');
  }
}

function downloadDOC() {
  setButtonState('btn-doc', 'loading', 'Generating...');
  try {
    const el = getExportEl();
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>${el.innerHTML}</body></html>`;
    const blob = new Blob(['\ufeff', html], {type: 'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Gulshan_Kumar_Resume.doc'; a.click();
    URL.revokeObjectURL(url);
    document.getElementById('resume-export').style.display = 'none';
    setButtonState('btn-doc', 'success', 'Downloaded!');
  } catch(e) {
    document.getElementById('resume-export').style.display = 'none';
    setButtonState('btn-doc', 'error', 'Error');
  }
}

document.getElementById('resume-content').innerHTML = generatePreviewHTML(RESUME_DATA);
</script>
