<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="256" cy="256" r="200" fill="url(#grad3)" opacity="0.1"/>
  
  <!-- Chart frame -->
  <rect x="120" y="140" width="280" height="240" rx="16" fill="url(#grad3)" opacity="0.15"/>
  <rect x="120" y="140" width="280" height="240" rx="16" fill="none" stroke="url(#grad3)" stroke-width="2" opacity="0.4"/>
  
  <!-- Y-axis -->
  <line x1="150" y1="170" x2="150" y2="350" stroke="url(#grad3)" stroke-width="2" opacity="0.5"/>
  
  <!-- X-axis -->
  <line x1="150" y1="350" x2="370" y2="350" stroke="url(#grad3)" stroke-width="2" opacity="0.5"/>
  
  <!-- Bar 1 -->
  <rect x="180" y="280" width="40" height="70" rx="8" fill="url(#grad3)" opacity="0.3"/>
  <rect x="180" y="280" width="40" height="70" rx="8" fill="none" stroke="#6366f1" stroke-width="3" filter="url(#glow3)"/>
  
  <!-- Bar 2 -->
  <rect x="235" y="240" width="40" height="110" rx="8" fill="url(#grad3)" opacity="0.3"/>
  <rect x="235" y="240" width="40" height="110" rx="8" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow3)"/>
  
  <!-- Bar 3 -->
  <rect x="290" y="200" width="40" height="150" rx="8" fill="url(#grad3)" opacity="0.3"/>
  <rect x="290" y="200" width="40" height="150" rx="8" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow3)"/>
  
  <!-- Growth arrow -->
  <path d="M 200 300 L 310 210" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,5" filter="url(#glow3)"/>
  <polygon points="305,205 315,208 308,218" fill="#38bdf8" filter="url(#glow3)"/>
  
  <!-- Trend line glow points -->
  <circle cx="200" cy="300" r="6" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="255" cy="255" r="6" fill="#38bdf8" filter="url(#glow3)"/>
  <circle cx="310" cy="210" r="6" fill="#38bdf8" filter="url(#glow3)"/>
  
  <!-- Dollar sign -->
  <text x="340" y="195" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="url(#grad3)" filter="url(#glow3)">$</text>
</svg>
